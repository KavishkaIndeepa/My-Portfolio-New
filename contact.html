<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Kavishka Indeepa</title>
  <meta name="description" content="Contact Kavishka Indeepa about collaboration and opportunities.">
  <meta name="author" content="Kavishka Indeepa">
  <link rel="icon" href="Home.JPG">
  <link rel="stylesheet" href="assets/fontAwsom/fontawesome-free-6.4.0-web/css/all.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="assets/css/normalize.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/media.css">
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/layout.js" defer></script>
  <script src="assets/js/script.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js" defer></script>
  <script src="assets/js/contact.js" defer></script>
</head>
<body data-page="contact">
  <main id="main" class="page">
    <section class="section">
      <div class="container contact-grid">
        <div class="reveal">
          <h1 class="page-title">Contact Me</h1>
          <p class="lead">Feel free to reach out! Whether it’s about collaboration, opportunities, or just to say hi.</p>
          <div class="contact-links">
            <a href="https://github.com/KavishkaIndeepa" target="_blank" rel="noopener">
              <i class="fab fa-github" aria-hidden="true"></i> Contribute on GitHub
            </a>
            <a href="https://wa.me/94779796003" target="_blank" rel="noopener">
              <i class="fab fa-whatsapp" aria-hidden="true"></i> Contact on WhatsApp
            </a>
          </div>
          <h2 class="small-heading">Follow me</h2>
          <div class="social-links" data-social-links></div>
        </div>

        <form class="contact-form reveal" id="contact-form" style="--delay: 150ms">
          <div class="form-row">
            <label>Name <input type="text" name="name" autocomplete="name" required></label>
            <label>Email <input type="email" name="email" autocomplete="email" required></label>
          </div>
          <div class="form-row">
            <label>Phone <input type="tel" name="phone" autocomplete="tel" required></label>
            <label>Subject <input type="text" name="subject" required></label>
          </div>
          <label>Message <textarea name="message" rows="5" required></textarea></label>
          <button class="button button-primary button-full" type="submit">Send Message</button>
        </form>
      </div>
    </section>
  </main>
</body>
</html>
