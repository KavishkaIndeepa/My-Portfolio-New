<div class="container contact-grid">
  <div class="reveal">
    <h2 class="section-title">Contact Me</h2>
    <p class="lead">Feel free to reach out! Whether it’s about collaboration, opportunities, or just to say hi.</p>
    <div class="contact-links">
      <a href="https://github.com/KavishkaIndeepa" target="_blank" rel="noopener">
        <i class="fab fa-github" aria-hidden="true"></i> Contribute on GitHub
      </a>
      <a href="https://wa.me/94779796003" target="_blank" rel="noopener">
        <i class="fab fa-whatsapp" aria-hidden="true"></i> Contact on WhatsApp
      </a>
    </div>
    <h3 class="small-heading">Follow me</h3>
    <div class="social-links" data-social-links></div>
  </div>

  <form class="contact-form reveal" id="contact-form" style="--delay: 150ms">
    <div class="form-row">
      <label>Name <input type="text" name="name" autocomplete="name" required></label>
      <label>Email <input type="email" name="email" autocomplete="email" required></label>
    </div>
    <div class="form-row">
      <label>Phone <input type="tel" name="phone" autocomplete="tel" required></label>
      <label>Subject <input type="text" name="subject" required></label>
    </div>
    <label>Message <textarea name="message" rows="5" required></textarea></label>
    <button class="button button-primary button-full" type="submit">Send Message</button>
  </form>
</div>
